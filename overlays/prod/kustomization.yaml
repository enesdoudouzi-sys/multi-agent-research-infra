apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/image
        # This line is auto-updated by CI — do not edit manually
        value: ghcr.io/enesdoudouzi-sys/multi-agent-research-backend:latest

  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/image
        # This line is auto-updated by CI — do not edit manually
        value: ghcr.io/enesdoudouzi-sys/multi-agent-research-frontend:latest

  - target:
      kind: Ingress
      name: ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: research.example.com
